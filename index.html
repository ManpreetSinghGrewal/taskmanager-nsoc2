<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Productivity Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand">
                <div class="brand-monogram" aria-hidden="true">&#10003;</div>
                <div class="brand-text">
                    <h1>Task Manager</h1>
                    <p class="app-subtitle">Productivity Dashboard</p>
                </div>
            </div>
            <button id="theme-toggle" class="theme-btn" type="button" aria-label="Switch to light mode" aria-pressed="false">Light mode</button>
        </header>

        <form id="todo-form" aria-label="Add new task">
            <input id="todo-input" type="text" placeholder="New Task..." required>
            <input id="todo-date" type="date" aria-label="Task due date">
            <select id="todo-priority" aria-label="Task priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <button type="submit">Add task</button>
            <button id="history-toggle" class="history-button" type="button" aria-pressed="false">History</button>
        </form>

        <section id="stats-dashboard" class="stats-dashboard" aria-label="Productivity overview">
            <div class="stats-grid">
                <button type="button" class="stat-card" data-stat-filter="all" aria-label="Filter all tasks">
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">Total</span>
                </button>
                <button type="button" class="stat-card active-filter" data-stat-filter="active" aria-label="Filter active tasks">
                    <span class="stat-value" id="stat-active">0</span>
                    <span class="stat-label">Active</span>
                </button>
                <button type="button" class="stat-card" data-stat-filter="done" aria-label="Filter completed tasks">
                    <span class="stat-value" id="stat-completed">0</span>
                    <span class="stat-label">Completed</span>
                </button>
                <button type="button" class="stat-card stat-overdue" data-stat-filter="overdue-task" aria-label="Filter overdue tasks">
                    <span class="stat-value" id="stat-overdue">0</span>
                    <span class="stat-label">Overdue</span>
                </button>
            </div>

            <div class="progress-container" aria-label="Task completion progress">
                <div class="progress-header">
                    <span class="progress-title">Completion Rate</span>
                    <span id="progress-percent" class="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-bar-wrapper">
                    <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
            </div>
        </section>

        <div id="task-toolbar" class="task-toolbar" aria-label="Task search and sorting">
            <div class="search-box">
                <span class="search-icon" aria-hidden="true">&#128269;</span>
                <input id="task-search" type="search" placeholder="Search tasks..." aria-label="Search tasks" autocomplete="off">
                <button id="search-clear" type="button" class="search-clear" aria-label="Clear search" hidden>&times;</button>
            </div>
            <div class="sort-box">
                <label for="task-sort" class="sort-label">Sort by:</label>
                <select id="task-sort" aria-label="Sort tasks">
                    <option value="default">Default</option>
                    <option value="dueDate-asc">Due Date (Earliest)</option>
                    <option value="dueDate-desc">Due Date (Latest)</option>
                    <option value="priority-desc">Priority (High to Low)</option>
                    <option value="priority-asc">Priority (Low to High)</option>
                    <option value="alphabetical-asc">Title (A &rarr; Z)</option>
                    <option value="alphabetical-desc">Title (Z &rarr; A)</option>
                </select>
            </div>
        </div>

        <div id="filters" hidden>
            <button type="button" data-filter="all" class="filter-btn active">All</button>
            <button type="button" data-filter="active" class="filter-btn">Active</button>
            <button type="button" data-filter="done" class="filter-btn">Done</button>
            <button type="button" data-filter="overdue-task" class="filter-btn">Overdue Tasks</button>
        </div>

        <ul id="todo-list"></ul>

        <section id="charts" hidden>
            <h2>Task overview</h2>

            <div class="chart-card">
                <h3>Tasks by priority</h3>
                <canvas id="priority-chart"></canvas>
                <div id="priority-legend"></div>
            </div>

            <div class="chart-card">
                <div class="weekly-chart-heading">
                    <h3 id="weekly-chart-title">Tasks completed this month</h3>
                    <div class="month-controls" aria-label="Choose chart month">
                        <button id="previous-month" type="button" aria-label="Show previous month">&#9664;</button>
                        <button id="next-month" type="button" aria-label="Show next month">&#9654;</button>
                    </div>
                </div>
                <canvas id="weekly-chart"></canvas>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
